<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal da Bíblia — NVI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#3182ce">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Portal da Bíblia">
</head>
<body>

    <header class="barra-topo">
        <div class="container topo-flex">
            <h1 class="logo">Portal da Bíblia</h1>
            
            <div class="controles-topo">
                <button id="btn-voltar" class="btn-voltar oculto">← Voltar</button>
                <input type="text" id="campo-pesquisa" class="campo-pesquisa" placeholder="Pesquisar livro...">
            </div>
        </div>
    </header>

    <main class="container conteudo-principal">
        <header class="cabecalho-leitura">
            <h2 id="titulo-leitura-atual">Selecione um Livro</h2>
        </header>

        <article id="area-texto-biblico" class="texto-biblico">
            <div class="carregando">Carregando livros...</div>
        </article>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registrado com sucesso:', reg.scope))
            .catch(err => console.error('Falha ao registrar o Service Worker:', err));
        });
      }
</script>
</body>
</body>
</html>
